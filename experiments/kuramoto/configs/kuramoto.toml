# Shared model, data and loss configuration for training and memory measurements.
epochs = 15
batch_size = 32
learning_rate = 1e-3
seed = 0
device = "gpu"
dtype = "float32"

model = "kuramoto_nsde"
hidden_dim = 128
drift_depth = 3
diffusion_depth = 2
activation = "silu"
diffusion_scale = 0.1
couple_theta_omega = false
drift_kind = "second_order_mean_field"

solver = "cfees25"
n_steps = 50
adjoint = "reversible"
adaptive_atol = 3e-2

N = 1000
data_seed = 0
data_dir = "experiments/kuramoto/data/"

loss_horizons = [0.125, 0.25, 0.5, 1.0]
loss_n_samples = 4
grad_clip_norm = 1.0

save_every_epoch = true
skip_plots = false
